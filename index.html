<main><div style="font-size:42px">✈</div><h1>RUMBO</h1><p>Estamos abriendo la nueva versión de Pilot & Family OS…</p><a href="./rumbo-next/">Entrar en RUMBO</a></main>
<script>
(async()=>{
 try{
  if("serviceWorker" in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(r=>r.unregister()));
  }
  if("caches" in window){
   const keys=await caches.keys();
   await Promise.all(keys.filter(k=>k.startsWith("rumbo-cache-")||k.startsWith("rumbo-next-shell-")).map(k=>caches.delete(k)));
  }
 }catch(e){}
 location.replace(new URL("./rumbo-next/",location.href).href);
})();
</script>
