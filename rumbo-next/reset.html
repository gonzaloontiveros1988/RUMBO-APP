<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta name="robots" content="noindex">
<title>Actualizando RUMBO…</title>
<style>
:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071521;color:#edf5f8;font:15px system-ui,sans-serif}
main{width:min(440px,calc(100% - 40px));padding:28px;border:1px solid #244457;border-radius:18px;background:linear-gradient(145deg,#122d40,#0d2232);box-sizing:border-box}
small{color:#51d4df;letter-spacing:2px}h1{font-size:24px;margin:12px 0}p{color:#a8bdc9;line-height:1.6}#status{font-size:13px;color:#51d4df}
</style>
</head>
<body><main><small>RUMBO · RECOVERY</small><h1>Actualizando la aplicación</h1><p>Estamos limpiando la versión antigua del navegador y cargando los archivos más recientes. Tus datos guardados en RUMBO no se borran.</p><div id="status">Desconectando la caché anterior…</div></main>
<script>
(async()=>{
 const status=document.getElementById("status");
 try{
  if("serviceWorker" in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(reg=>reg.unregister()));
  }
  if("caches" in window){
   const keys=await caches.keys();
   await Promise.all(keys.map(key=>caches.delete(key)));
  }
  status.textContent="Caché limpiada. Abriendo la versión nueva…";
 }catch(e){
  status.textContent="Abriendo RUMBO sin reutilizar esta página…";
 }
 const target=new URL("./",location.href);
 target.searchParams.set("v","fresh-20261113-3789e5f");
 location.replace(target.href);
})();
</script></body></html>
